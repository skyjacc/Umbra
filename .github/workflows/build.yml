name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Windows runner so build-zip.ps1 (System.IO.Compression, forward-slash zip entries)
    # runs exactly as it does locally and produces a Chrome-Web-Store-valid package.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install chromium
      - run: npm run test:audio
      - run: npm run build
      - run: npm run test:ui

      - name: Verify manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content dist/manifest.json -Raw | ConvertFrom-Json).version
          $tag = $env:RELEASE_TAG.Substring(1)
          if ($v -ne $tag) { throw "manifest version $v != tag $tag" }
          Write-Host "version $v matches tag"

      - name: Package store zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build-zip.ps1

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: umbra-eq-zip
          path: release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: umbra-eq-zip
          path: release
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*.zip
          generate_release_notes: true
